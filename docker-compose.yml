

services:
  # --- CORE INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    container_name: nebulax-db
    profiles: ["minimal", "core", "full", "red", "blue", "space", "target", "intel", "grc"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nebulax_secret}
      POSTGRES_DB: nebulax_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nebulax-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nebulax_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nebulax-bus
    profiles: ["minimal", "core", "full", "red", "blue", "space", "target", "intel", "grc"]
    ports:
      - "6379:6379"
    networks:
      - nebulax-net

  # --- NEBULAX CORE ---
  core-api:
    build: ./services/core
    container_name: nebulax-core
    profiles: ["minimal", "core", "full", "red", "blue", "space", "target", "intel", "grc"]
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:nebulax_secret@nebulax-db:5432/nebulax_core
      - REDIS_URL=redis://nebulax-bus:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nebulax-net
    volumes:
      - ./services/core:/app

  # --- VISUALIZATION ---
  dashboard:
    build: ./services/dashboard
    container_name: nebulax-dashboard-v2
    profiles: ["minimal", "core", "full"]
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max-old-space-size=2048
    networks:
      - nebulax-net
    depends_on:
      - core-api
    deploy:
      resources:
        limits:
          memory: 2G

  # --- SPACE PLUGINS ---
  space-tracker:
    build: ./services/space-guard/tracker
    container_name: nebulax-space-tracker
    profiles: ["minimal", "space", "full"]
    command: python -u main.py
    environment:
      - CORE_API_URL=http://nebulax-core:8000/events/ingest
    networks:
      - nebulax-net
    depends_on:
      - core-api
    volumes:
      - ./services/space-guard/tracker:/app
    deploy:
      resources:
        limits:
          memory: 128M

  ground-station:
    build: ./services/space-guard/ground-sim
    container_name: nebulax-ground-sim
    profiles: ["minimal", "space", "full"]
    ports:
      - "5001:5000"
    networks:
      - nebulax-net
    depends_on:
      - core-api
    volumes:
      - ./services/space-guard/ground-sim:/app

  # --- TARGET ENVIRONMENT ---
  target-web:
    build: ./services/target/public-web
    container_name: nebulax-target-web
    profiles: ["target", "red", "full"]
    command: python app.py
    ports:
      - "8080:5000"
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/target/public-web:/app

  # --- BLUE TEAM (DEFENSE) ---
  blue-sentinel:
    build: ./services/blue-team/detection-engine
    container_name: nebulax-blue-sentinel
    profiles: ["blue", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/blue-team/detection-engine:/app
    deploy:
      resources:
        limits:
          memory: 128M

  honeypot:
    build: ./services/blue-team/honeypot-ssh
    container_name: nebulax-honeypot
    profiles: ["blue", "red", "full"]
    command: python -u main.py
    ports:
      - "2222:2222"
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/blue-team/honeypot-ssh:/app

  net-watchdog:
    build: ./services/blue-team/net-watchdog
    container_name: nebulax-net-watchdog
    profiles: ["blue", "full"]
    command: python -u main.py
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/blue-team/net-watchdog:/app
    deploy:
      resources:
        limits:
          memory: 128M

  net-forensics:
    build: ./services/blue-team/network-forensics
    container_name: nebulax-net-forensics
    profiles: ["blue", "full"]
    command: python -u main.py
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/blue-team/network-forensics:/app
    deploy:
      resources:
        limits:
          memory: 128M

  # --- RED TEAM (OFFENSE) ---
  red-attacker:
    build: ./services/red-team/attack-engine
    container_name: nebulax-red-attacker
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    depends_on:
      - ground-station
      - core-api
      - honeypot
      - target-web
    volumes:
      - ./services/red-team/attack-engine:/app
    deploy:
      resources:
        limits:
          memory: 128M

  password-auditor:
    build: ./services/red-team/password-auditor
    container_name: nebulax-password-auditor
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/red-team/password-auditor:/app
    deploy:
      resources:
        limits:
          memory: 128M

  ransomware-sim:
    build: ./services/red-team/ransomware-sim
    container_name: nebulax-ransomware
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/red-team/ransomware-sim:/app
    deploy:
      resources:
        limits:
          memory: 128M

  vuln-scanner:
    build: ./services/red-team/vuln-scanner
    container_name: nebulax-vuln-scanner
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/red-team/vuln-scanner:/app
    deploy:
      resources:
        limits:
          memory: 256M # Nmap needs a bit more RAM

  c2-beacon:
    build: ./services/red-team/c2-beacon
    container_name: nebulax-c2-beacon
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/red-team/c2-beacon:/app
    deploy:
      resources:
        limits:
          memory: 128M

  # --- TARGET INFRASTRUCTURE ---
  internal-infra:
    build: ./services/target/internal-infra
    container_name: nebulax-internal-infra
    profiles: ["target", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/target/internal-infra:/app

  identity-manager:
    build: ./services/target/identity-manager
    container_name: nebulax-identity-manager
    profiles: ["target", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/target/identity-manager:/app

  ids-suricata:
    build: ./services/blue-team/ids-suricata
    container_name: nebulax-ids-suricata
    profiles: ["blue", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/blue-team/ids-suricata:/app

  edr-agent:
    build: ./services/blue-team/edr-agent
    container_name: nebulax-edr-agent
    profiles: ["blue", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/blue-team/edr-agent:/app

  # --- RED TEAM (OFFENSE) ---
  web-injector:
    build: ./services/red-team/web-injector
    container_name: nebulax-web-injector
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/red-team/web-injector:/app

  apt-emulator:
    build: ./services/red-team/apt-emulator
    container_name: nebulax-apt-emulator
    profiles: ["red", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/red-team/apt-emulator:/app

  # --- GRC & COMPLIANCE ---
  policy-mapper:
    build: ./services/grc/policy-mapper
    container_name: nebulax-policy-mapper
    profiles: ["grc", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/grc/policy-mapper:/app

  incident-reporter:
    build: ./services/grc/incident-reporter
    container_name: nebulax-incident-reporter
    profiles: ["grc", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/grc/incident-reporter:/app

  # --- THREAT INTEL ---
  cve-feeder:
    build: ./services/intel/cve-feeder
    container_name: nebulax-cve-feeder
    profiles: ["intel", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/intel/cve-feeder:/app

  ioc-manager:
    build: ./services/intel/ioc-manager
    container_name: nebulax-ioc-manager
    profiles: ["intel", "full"]
    command: python -u main.py
    environment:
      - CORE_HOST=nebulax-core
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/intel/ioc-manager:/app

  # --- SPACE GUARD ---
  rf-receiver:
    build: ./services/space-guard/rf-receiver
    container_name: nebulax-rf-receiver
    profiles: ["space", "full"]
    command: python -u main.py
    networks:
      - nebulax-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - core-api
    volumes:
      - ./services/space-guard/rf-receiver:/app

networks:
  nebulax-net:
    driver: bridge

volumes:
  postgres_data: